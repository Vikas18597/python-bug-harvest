name: ci

on:
  pull_request:
  push:
    branches: [main, "harvest-run/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
      - run: pip install -e ".[dev]"
      - run: pytest -q
