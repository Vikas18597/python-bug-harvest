name: harvest

# Rebuild and verify a candidate list on ubuntu runners, one matrix job per shard.
# Trigger manually (workflow_dispatch) or by pushing a `harvest-run/**` branch.
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: Candidate list file (in this repo)
        default: candidates/trial-20.json
      per_job:
        description: Candidates per matrix job (raise for large lists; matrix limit is 256 jobs)
        default: "1"
      max_parallel:
        description: Max concurrent verify jobs
        default: "20"
      target_python:
        description: Python version tried first
        default: "3.13"
      kaggle_slug:
        description: Kaggle dataset slug (upload is skipped unless KAGGLE_API_TOKEN, or legacy KAGGLE_USERNAME + KAGGLE_KEY, secrets exist; owner = KAGGLE_USERNAME)
        default: python-bug-harvest
  push:
    branches: ["harvest-run/**"]

permissions:
  contents: read

env:
  CANDIDATES: ${{ inputs.candidates || 'candidates/trial-20.json' }}
  PER_JOB: ${{ inputs.per_job || '1' }}
  TARGET_PYTHON: ${{ inputs.target_python || '3.13' }}
  KAGGLE_SLUG: ${{ inputs.kaggle_slug || 'python-bug-harvest' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyarrow
      - uses: actions/cache@v6
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('harvest/sources.py') }}
      - id: plan
        run: python -m harvest plan --candidates "$CANDIDATES" --out out/plan --per-job "$PER_JOB"
      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: out/plan
          retention-days: 7

  verify:
    needs: plan
    name: verify ${{ matrix.ids }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: out/plan
      - name: Verify candidates
        env:
          IDS: ${{ matrix.ids }}
        run: python3 -m harvest verify --plan out/plan/candidates.jsonl --ids "$IDS" --out out/results --python "$TARGET_PYTHON"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.shard }}
          path: out/results
          retention-days: 7

  aggregate:
    needs: [plan, verify]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: out/plan
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: out/results
          merge-multiple: true
      - run: python -m harvest aggregate --results out/results --plan out/plan/candidates.jsonl --out out/dataset
      - uses: actions/upload-artifact@v7
        with:
          name: harvest-dataset
          path: out/dataset
          retention-days: 7
      - name: Upload to private Kaggle dataset (skipped without secrets)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # kaggle>=1.8.3 reads KAGGLE_API_TOKEN (https://github.com/Kaggle/kaggle-cli/blob/main/docs/README.md#authentication).
          # Pinned for reproducible runs. `six` is added by hand: kaggle>=1.8.4 no longer declares it on PyPI, but
          # kaggle/models/upload_file.py still does `import six`, so the CLI crashes on start without it.
          has_token=false
          if [ -n "$KAGGLE_API_TOKEN" ]; then has_token=true; fi
          has_legacy_pair=false
          if [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ]; then has_legacy_pair=true; fi
          # Without credentials, skip the install; the upload command below then logs "skipped" and exits 0.
          if [ "$has_token" = true ] || [ "$has_legacy_pair" = true ]; then
            pip install -q "kaggle==2.2.5" six
          fi
          python -m harvest kaggle-upload --dir out/dataset --slug "$KAGGLE_SLUG" --message "run ${{ github.run_id }}"
